[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conformalguard"
version = "1.0.0"
description = "Distribution-Free Safety Certification for Multi-Agent LLM Systems"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Roger Nick Anaedevha", email = "roger@robustidps.ai" },
    { name = "Alexander Gennadievich Trofimov", email = "agtrofimov@robustidps.ai" }
]
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
embeddings = ["sentence-transformers>=2.6"]          # --features st in scripts/rjudge_run.py
llm = ["transformers>=4.40", "accelerate>=0.27"]     # scripts/rjudge_llm_judge.py
plots = ["matplotlib>=3.7"]
serve = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5"]
agents = ["pyautogen>=0.2", "metagpt>=0.8", "langgraph>=0.0.40", "crewai>=0.30"]

[project.scripts]
conformalguard-train     = "conformalguard.cli:train"
conformalguard-calibrate = "conformalguard.cli:calibrate"
conformalguard-eval      = "conformalguard.cli:evaluate"
conformalguard-serve     = "conformalguard.cli:serve"

[tool.setuptools.packages.find]
include = ["conformalguard*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py310"
