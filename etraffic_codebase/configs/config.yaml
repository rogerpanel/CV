# ==============================================================================
# Encrypted Traffic IDS Configuration
# Paper: "Hybrid Spatial-Temporal Deep Learning for Privacy-Preserving
#         Encrypted Traffic Intrusion Detection"
# Submitted to: Engineering Applications of Artificial Intelligence (EAAI)
# ==============================================================================

# Dataset Configuration
data:
  datasets:
    - CICIDS2017
    - CICIDS2018
    - UNSW-NB15
    - ISCX-VPN-NonVPN-2016
    - CESNET-TLS-Year22
    - VisQUIC
    - CIC-IoT-2023
    - Edge-IIoTset
    - BoT-IoT
    - IIS3D  # HTTPS Traffic Classification (DOI: 10.34740/kaggle/dsv/12479689)

  # Data split ratios (stratified)
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

  # Feature parameters
  max_packets_per_flow: 100
  feature_dim: 88  # 88 numerical features in IIS3D dataset
  use_encrypted_only: true

  # Class balancing
  balance_strategy: 'focal_loss'  # Options: 'weighted', 'focal_loss', 'smote'

# Model Architecture Configuration
model:
  # Hybrid CNN-LSTM (Section 3.1)
  cnn_lstm:
    cnn_channels: [64, 128, 256, 512]
    kernel_sizes: [3, 5, 7, 9]
    use_depthwise_separable: true  # 67% complexity reduction
    lstm_hidden_dim: 256
    lstm_num_layers: 2
    bidirectional: true
    dropout: 0.3

  # Transformer (Section 3.2)
  transformer:
    d_model: 512
    nhead: 8
    num_encoder_layers: 6
    dim_feedforward: 2048
    dropout: 0.1
    max_seq_length: 100
    use_eca: true  # Efficient Channel Attention

  # Graph Neural Network (Section 3.3)
  gnn:
    hidden_channels: 128
    num_layers: 3
    aggregation: 'mean'
    use_graphsage: true
    dropout: 0.2

  # Ensemble (Section 3.4)
  ensemble:
    voting_strategy: 'soft'
    use_stacking: true
    meta_learner: 'mlp'

# Training Configuration (Section 4.2)
training:
  optimizer: 'adam'
  learning_rate: 0.001
  lr_scheduler: 'exponential'
  lr_decay_rate: 0.95
  lr_decay_steps: 10

  batch_size: 128
  num_epochs: 100
  early_stopping_patience: 10
  gradient_clip_value: 1.0

  loss_function: 'focal_loss'
  focal_gamma: 2.0
  focal_alpha: 0.25

  weight_decay: 0.0001
  label_smoothing: 0.1

# Federated Learning (Section 3.5)
federated:
  num_clients: 10
  num_rounds: 20
  local_epochs: 5
  client_fraction: 1.0

  aggregation: 'tabf'  # Options: 'fedavg', 'fedprox', 'gradient_similarity', 'tabf'

  # Traffic-Aware Byzantine Filtering (Algorithm 1)
  tabf:
    alpha: 0.5
    percentile_threshold: 75.0
    use_temporal_loss: true   # KL divergence on IAT distributions
    use_protocol_loss: true   # Frobenius norm on TLS correlations
    num_bins_iat: 50
    tls_feature_indices: [3, 4, 5, 6, 7]

  # Differential Privacy
  use_differential_privacy: true
  epsilon: 1.0
  delta: 1e-5
  max_grad_norm: 1.0
  noise_multiplier: 1.1

  # CKKS Homomorphic Encryption
  use_homomorphic_encryption: false  # ~12% communication overhead

# Self-Supervised Pretraining (Section 3.6)
self_supervised:
  algorithm: 'infonce'
  temperature: 0.07
  projection_dim: 128
  num_epochs: 100
  learning_rate: 0.001
  augmentation:
    jitter_std: 0.1
    mask_ratio: 0.15
    permute_max_segments: 5

# Few-Shot Learning (Section 3.7)
few_shot:
  n_way: 5
  k_shot: 5
  query_samples: 15
  num_episodes: 1000
  meta_learning_rate: 0.001
  inner_learning_rate: 0.01
  inner_steps: 5
  algorithm: 'prototypical'  # Options: 'prototypical', 'maml'

# Explainability (Section 3.8)
explainability:
  use_shap: true
  shap_background_samples: 100
  shap_num_features: 20
  generate_attention_maps: true

# Adversarial Robustness (Section 3.4)
adversarial:
  train_adversarial: true
  attack_method: 'protocol_pgd'
  epsilon: 0.1
  pgd_steps: 10
  pgd_alpha: 0.01

  # Protocol-Admissible Perturbations (Definition 1)
  protocol_constraints:
    enforce_constraints: true
    min_packet_size: 40    # bytes (TCP/IP minimum)
    max_packet_size: 1500  # bytes (MTU)
    min_iat: 0.0           # milliseconds
    max_iat: 60000.0       # milliseconds

  # Randomized Smoothing (Theorem 1)
  randomized_smoothing:
    sigma: 0.1
    n0: 100
    n: 10000
    alpha: 0.001
    protocol_rho: 0.42     # TLS 1.3 constraint fraction
    # R_enhanced = R_std * sqrt(1 + (1-rho)/rho) ~ 1.58x for rho=0.42

# Evaluation (Section 4.3)
evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc
    - pr_auc
    - mcc
    - fpr
  compute_per_class_metrics: true
  plot_confusion_matrix: true

# Hardware
hardware:
  device: 'cuda'
  num_workers: 8
  pin_memory: true
  mixed_precision: true

# Logging
logging:
  use_tensorboard: true
  log_interval: 10
  save_checkpoints: true
  checkpoint_interval: 5
  log_dir: './logs'
  checkpoint_dir: './checkpoints'

# Reproducibility
seed: 42
deterministic: true
