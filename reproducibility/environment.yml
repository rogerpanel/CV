# Conda environment for TA-BN-ODE + DSTPP framework
name: tabn-ode
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.0
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - scipy>=1.11
  - matplotlib>=3.7
  - seaborn>=0.12
  - pyyaml>=6.0
  - tqdm>=4.66
  - pip:
    - torchdiffeq>=0.2.3
    - kagglehub>=0.3.0
