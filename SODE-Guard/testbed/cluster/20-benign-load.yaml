# Benign load: Locust user sessions against the boutique shop, running alongside
# every scenario so that the captured traffic is a realistic mix of benign and
# attack flows (the benign class of the testbed corpus).
apiVersion: v1
kind: ConfigMap
metadata: { name: locustfile, namespace: victims }
data:
  locustfile.py: |
    from locust import HttpUser, task, between
    class Shopper(HttpUser):
        wait_time = between(1, 5)
        host = "http://boutique.victims.svc.cluster.local"
        @task(5)
        def browse(self):
            self.client.get("/")
            self.client.get("/product/OLJCESPC7Z")
        @task(2)
        def cart(self):
            self.client.post("/cart", data={"product_id": "OLJCESPC7Z", "quantity": "1"})
        @task(1)
        def checkout(self):
            self.client.post("/cart/checkout", data={
                "email": "shopper@example.com", "street_address": "1 Test St",
                "zip_code": "10001", "city": "Testville", "state": "TS",
                "country": "Testland", "credit_card_number": "4432801561520454",
                "credit_card_expiration_month": "1", "credit_card_expiration_year": "2030",
                "credit_card_cvv": "672"})
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: benign-load, namespace: victims }
spec:
  replicas: 1
  selector: { matchLabels: { app: benign-load } }
  template:
    metadata: { labels: { app: benign-load } }
    spec:
      volumes:
        - name: locust
          configMap: { name: locustfile }
      containers:
        - name: locust
          image: locustio/locust:2.24.0
          args: ["-f", "/mnt/locust/locustfile.py", "--headless",
                 "-u", "25", "-r", "2", "--run-time", "0"]   # steady background load
          volumeMounts:
            - { name: locust, mountPath: /mnt/locust }
